body:
  text: 之一碑陽建崇寺亡祖秦州都酋長呂帛冰女定羌女驃騎大將軍南道大行臺秦州刺史顯親縣開國伯亡伯興成伯母帶神龍驤將軍都督浙州刺史亡父興進亡母元要亡母男娥亡母僧姿亡叔法成叔雙進兄天猥弟道伯亡姊李姿姊男姿妹伯男輔國將軍中散都督開國子宇文建輔國將軍中散大都督宇文嵩弟進周崇息雍周法達孫洪濟崇妻王光容息女舍徽亥子明月息妻王花姪季和姪子孝子順子恭保和達和善和伯母王阿松佐阿男兄妻仵思妙弟妻王遝輝姪女仙輝小輝鏑女弟婦權常妙息萬女姊赤女佛弟子權法超妹皂花妹明光佛弟子王湛書佛弟子權仕賓之二碑陰惟建德三年歲次甲午二月壬辰朔草八日己未佛弟子本姓呂蒙大祖賜姓宇文建崇夫靈象神容遺形異品毗倫讚道敷五抽之劫化顯揚設教斯疇百代聚沙起塔欲崇虛之妙旨崇實因業淺又息別將法和為國展效募衝戎首從柱國銚國公益州征討因陳身故是以削竭家珍興越福邦造浮圖三級石銘一立師子乙雙輒於冥積採取將來之因身骸分流欲追之懷竊求乙念之善又願帝祚永隆万國來助普濟乙切曠劫師宗六道衆生同登斯福
